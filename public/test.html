<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test TrueChange</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">

    <style>
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0d6efd, #003d92);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
        }

        .login-card {
            width: 100%;
            max-width: 430px;
            background: #fff;
            border-radius: 22px;
            box-shadow: 0 20px 45px rgba(0,0,0,0.25);
            overflow: hidden;
        }

        .login-header {
            background: linear-gradient(45deg, #0d6efd, #003d92);
            color: white;
            text-align: center;
            padding: 35px 25px;
        }

        .login-header i {
            font-size: 3rem;
            margin-bottom: 10px;
        }

        .login-body {
            padding: 35px;
        }

        .btn-blue-grad {
            background: linear-gradient(45deg, #0d6efd, #003d92);
            border: none;
        }

        .btn-blue-grad:hover {
            background: linear-gradient(45deg, #003d92, #0d6efd);
        }

        .test-info {
            background: #f1f6ff;
            border-left: 4px solid #0d6efd;
            padding: 12px;
            border-radius: 8px;
            font-size: 0.9rem;
        }
    </style>
</head>

<body>

    <div class="login-card">
        <div class="login-header">
            <i class="fa fa-refresh"></i>
            <h2 class="fw-bold mb-1">TrueChange</h2>
            <p class="mb-0">Panel de pruebas de la aplicación</p>
        </div>

        <div class="login-body">
            <div class="test-info mb-4">
                Acceso privado para cargar datos de prueba y realizar comprobaciones.
            </div>

            <form onsubmit="validarAcceso(event)">
                <div class="mb-3">
                    <label class="form-label fw-bold text-muted small">USUARIO</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light text-primary">
                            <i class="fa fa-user"></i>
                        </span>
                        <input type="text" id="usuario" class="form-control" placeholder="Usuario de test" required>
                    </div>
                </div>

                <div class="mb-4">
                    <label class="form-label fw-bold text-muted small">CONTRASEÑA</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light text-primary">
                            <i class="fa fa-lock"></i>
                        </span>
                        <input type="password" id="password" class="form-control" placeholder="Contraseña" required>
                    </div>
                </div>

                <div id="mensajeError" class="alert alert-danger d-none">
                    Usuario o contraseña incorrectos.
                </div>

                <button type="submit" class="btn btn-primary btn-blue-grad w-100 py-2 fw-bold rounded-3">
                    <i class="fa fa-check-circle me-2"></i>Acceder a pruebas
                </button>
                   <button type="reset" class="btn btn-danger btn-red-grad w-100 py-2 mt-2 fw-bold rounded-3">
                    <i class="fa fa-check-circle me-2"></i>Cancelar
                </button>
            </form>
        </div>
    </div>

    <script>
        function validarAcceso(event) {
            event.preventDefault();

            const usuario = document.getElementById("usuario").value.trim();
            const password = document.getElementById("password").value.trim();
            const mensajeError = document.getElementById("mensajeError");

            const usuarioCorrecto = "admin";
            const passwordCorrecta = "1234";

            if (usuario === usuarioCorrecto && password === passwordCorrecta) {
                window.location.href = "../src/php/pruebas.php";
            } else {
                mensajeError.classList.remove("d-none");
            }
        }
    </script>

</body>
</html>
